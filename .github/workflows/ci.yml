name: brew

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    # Public repository: GitHub-hosted runners are used (free for public repositories).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/sureforgetech"
          mkdir -p "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-tap"
      - name: Style
        run: brew style sureforgetech/tap
      - name: Audit
        run: brew audit --strict --online --tap sureforgetech/tap
      - name: Install and test the formula
        run: |
          brew install --formula sureforgetech/tap/sureforge-cfr
          brew test sureforgetech/tap/sureforge-cfr
